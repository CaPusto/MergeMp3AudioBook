name: Build and Release

on:
  push:
    tags:
      - 'v*' # Triggers the build when a version tag is created, e.g., v1.0.0
  workflow_dispatch: # Allows manual workflow execution via the Actions tab

permissions:
  contents: write

jobs:
  # Job for Linux and Windows builds (compiled using docker/fyne-cross on Ubuntu)
  build-cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
            artifact_name: MergeMp3AudioBook-linux-amd64
          - os: windows
            arch: amd64
            artifact_name: MergeMp3AudioBook-windows-amd64.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Fyne-cross
        run: go install ://github.com

      - name: Build Application
        run: |
          if [ "${{ matrix.os }}" = "windows" ]; then
            # Build for Windows with the flag to hide the background terminal window
            fyne-cross windows -arch=${{ matrix.arch }} -ldflags="-s -w -H=windowsgui"
            mv fyne-cross/bin/windows-amd64/*.exe ./${{ matrix.artifact_name }}
          else
            # Build for Linux
            fyne-cross linux -arch=${{ matrix.arch }} -ldflags="-s -w"
            mv fyne-cross/bin/linux-amd64/* ./${{ matrix.artifact_name }}
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  # Job specifically for macOS builds (compiled natively on macOS runners)
  build-mac:
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            artifact_name: MergeMp3AudioBook-macOS-Intel
          - arch: arm64
            artifact_name: MergeMp3AudioBook-macOS-AppleSilicon

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Install Fyne CLI
        run: go install fyne.io/fyne/v2/cmd/fyne@latest

      - name: Package macOS App
        run: |
          # Package the Go application into a standard macOS .app bundle
          GOARCH=${{ matrix.arch }} fyne package -os darwin -icon mp3m4b.png
          
          # Compress the .app bundle into a ZIP archive for release
          zip -r ${{ matrix.artifact_name }}.zip MergeMp3AudioBook.app

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.zip

  # Job to collect all builds and create a GitHub Release
  release:
    needs: [build-cross, build-mac]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MergeMp3AudioBook-linux-amd64/MergeMp3AudioBook-linux-amd64
            MergeMp3AudioBook-windows-amd64.exe/MergeMp3AudioBook-windows-amd64.exe
            MergeMp3AudioBook-macOS-Intel/MergeMp3AudioBook-macOS-Intel.zip
            MergeMp3AudioBook-macOS-AppleSilicon/MergeMp3AudioBook-macOS-AppleSilicon.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
